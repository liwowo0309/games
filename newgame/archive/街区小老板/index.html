<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>街区小老板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <button type="button" class="boss-chip" id="btnBoss" aria-label="我的形象">
        <span class="boss-chip-avatar" id="chipAvatar"></span>
        <span class="boss-chip-text">
          <strong id="playerNameLabel">小老板</strong>
          <small id="streetGrade">街区评级 C</small>
        </span>
      </button>
      <div class="currency-row">
        <div class="currency soft">
          <span class="coin-badge" aria-hidden="true"></span>
          <span id="softCoins">0</span>
        </div>
        <div class="rate" id="incomeRate">+0/秒</div>
      </div>
      <button type="button" class="icon-btn" id="btnSettings" aria-label="设置">⚙</button>
    </header>

    <main class="main-scroll" id="mainScroll">
      <!-- 街区场景 -->
      <section class="vista" id="vista" aria-label="我的街区">
        <div class="sky">
          <div class="sun"></div>
          <div class="cloud c1"></div>
          <div class="cloud c2"></div>
          <div class="cloud c3"></div>
        </div>
        <div class="city-row" id="cityRow"></div>
        <div class="road">
          <div class="road-line"></div>
          <div class="peds" id="peds"></div>
          <div class="customers" id="customers"></div>
          <div class="boss-stage" id="bossStage">
            <div class="speech" id="bossSpeech">今天也要开张！</div>
            <div class="boss-figure" id="bossFigure"></div>
            <div class="boss-shadow"></div>
          </div>
        </div>
        <div class="combo-hud" id="comboHud">
          <span id="comboText">连击 ×1</span>
          <span id="skillStats">接待 0 · 漏单 0</span>
        </div>
        <div class="float-layer" id="floatLayer"></div>
      </section>

      <p class="street-hint" id="streetHint">客人头顶冒泡时快点！连击越高越赚 · 定价和方针会改收益结构</p>

      <!-- 经营面板 -->
      <section class="panel active" id="panelManage" data-panel="manage">
        <div class="strategy-strip" id="strategyStrip"></div>
        <div class="shop-grid" id="shopGrid"></div>
      </section>

      <!-- 决策面板 -->
      <section class="panel" id="panelStrategy" data-panel="strategy">
        <h2 class="panel-title">经营决策</h2>
        <p class="panel-desc">这里才是比水平的地方：定价、方针、专精、敢不敢投促销</p>

        <h3 class="subhead">定价策略</h3>
        <div class="choice-grid" id="pricingChoices"></div>

        <h3 class="subhead">今日方针 <small id="planCooldown"></small></h3>
        <div class="choice-grid" id="planChoices"></div>

        <h3 class="subhead">专精路线（二选一，永久）</h3>
        <div class="choice-grid" id="specChoices"></div>

        <h3 class="subhead">风险机会</h3>
        <div class="event-card" id="eventCard"></div>
      </section>

      <!-- 形象面板 -->
      <section class="panel" id="panelLook" data-panel="look">
        <h2 class="panel-title">我的形象</h2>
        <p class="panel-desc">起个名字，换发型服装——街坊都能看见你</p>
        <div class="look-preview" id="lookPreview"></div>
        <label class="field">
          <span>老板昵称</span>
          <input type="text" id="nameInput" maxlength="8" placeholder="最多8个字" />
        </label>
        <div class="option-block">
          <h3>发型</h3>
          <div class="option-row" id="hairOptions"></div>
        </div>
        <div class="option-block">
          <h3>衣服</h3>
          <div class="option-row" id="outfitOptions"></div>
        </div>
        <div class="option-block">
          <h3>肤色</h3>
          <div class="option-row" id="skinOptions"></div>
        </div>
        <button type="button" class="primary-btn" id="btnSaveLook">保存形象</button>
      </section>

      <!-- 广场轻社交 -->
      <section class="panel" id="panelPlaza" data-panel="plaza">
        <h2 class="panel-title">街区广场</h2>
        <p class="panel-desc">和街坊比比谁的店更旺（无聊天，安全好玩）</p>
        <div class="card-share" id="streetCard">
          <div class="card-share-avatar" id="cardAvatar"></div>
          <div class="card-share-body">
            <strong id="cardName">小老板</strong>
            <span id="cardStats">评级 C · 0/秒</span>
          </div>
          <button type="button" class="mini-btn" id="btnCopyCard">复制名片</button>
        </div>
        <h3 class="subhead">本周街坊榜</h3>
        <ol class="rival-list" id="rivalList"></ol>
      </section>
    </main>

    <nav class="bottom-bar">
      <button type="button" class="nav-btn active" data-panel="manage">
        <span class="nav-ico">🏪</span>经营
      </button>
      <button type="button" class="nav-btn" data-panel="strategy">
        <span class="nav-ico">🧠</span>决策
      </button>
      <button type="button" class="nav-btn" data-panel="look">
        <span class="nav-ico">🧑</span>形象
      </button>
      <button type="button" class="nav-btn" data-panel="plaza">
        <span class="nav-ico">🏆</span>广场
      </button>
    </nav>
  </div>

  <div class="modal hidden" id="offlineModal" role="dialog" aria-modal="true">
    <div class="modal-card offline-card">
      <div class="modal-boss" id="modalBoss"></div>
      <h2>营业报告</h2>
      <p class="modal-sub" id="offlineTime">你离开了一会儿</p>
      <p class="offline-amount"><span id="offlineAmount">0</span></p>
      <p class="modal-note">店员帮你看着呢，点领取入账</p>
      <button type="button" class="primary-btn" id="btnClaimOffline">领取奖励</button>
    </div>
  </div>

  <div class="modal hidden" id="settingsModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2>设置</h2>
      <p class="modal-sub">本地存档 · 无广告</p>
      <button type="button" class="primary-btn" id="btnOfflineEntry">查看离线收益</button>
      <button type="button" class="danger-btn" id="btnResetSave">重置存档</button>
      <button type="button" class="ghost-btn" id="btnCloseSettings">关闭</button>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
