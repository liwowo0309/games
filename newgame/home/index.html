<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e07a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>开口生活</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <section class="screen" id="screen-setup">
    <div class="setup-card">
      <p class="eyebrow">开口生活</p>
      <h1>对着它说话，<br>今天的事才会继续。</h1>
      <p class="lead">妈妈请你买菜、妹妹要蹦得更高、突然下雨要不要回家——先开口，故事才往下走。</p>
      <form id="setup-form">
        <label>你叫什么
          <input id="kid-name" name="name" maxlength="12" required placeholder="比如 Xiaoyu" />
        </label>
        <label>现在几年级
          <select id="kid-grade">
            <option value="2">二年级</option>
            <option value="3">三年级</option>
            <option value="4">四年级</option>
            <option value="5">五年级</option>
            <option value="6">六年级</option>
          </select>
        </label>
        <button type="submit" class="primary">进家门</button>
      </form>
      <p class="fine">听对方说完，再按住用自己的英语回答。意思对了就行。</p>
    </div>
  </section>

  <section class="screen" id="screen-world" hidden>
    <header class="hud">
      <div>
        <strong id="hud-name">小朋友</strong>
        <span id="hud-grade">二年级</span>
        <span id="hud-speak">本周开口 0</span>
        <span id="hud-coins" class="hud-coins">🪙 8</span>
        <span id="hud-place">家里</span>
      </div>
      <div class="hud-actions">
        <button type="button" id="btn-home">回家</button>
        <button type="button" id="btn-album">相册</button>
        <button type="button" id="btn-parent">家长</button>
      </div>
    </header>
    <p id="hint">你在家里。点门可以出门。走到带 ! 的人旁边说话。</p>
    <div class="stage">
      <canvas id="world" width="1100" height="740"></canvas>
      <div class="pad" id="move-pad">
        <button type="button" class="pad-btn pad-up" data-dx="0" data-dy="-1" aria-label="上">↑</button>
        <button type="button" class="pad-btn pad-left" data-dx="-1" data-dy="0" aria-label="左">←</button>
        <button type="button" class="pad-btn pad-right" data-dx="1" data-dy="0" aria-label="右">→</button>
        <button type="button" class="pad-btn pad-down" data-dx="0" data-dy="1" aria-label="下">↓</button>
      </div>
    </div>
    <p class="fine bar">地图变大了，镜头跟着你走。街上有家、小店、诊所、餐厅、公园、车站和学校。</p>
  </section>

  <section class="screen" id="screen-album" hidden>
    <header class="hud">
      <strong>生活相册</strong>
      <button type="button" data-back>回到生活</button>
    </header>
    <div id="album-list" class="album-list"></div>
  </section>

  <section class="screen" id="screen-parent" hidden>
    <header class="hud">
      <strong>家长</strong>
      <button type="button" data-back>回到生活</button>
    </header>
    <div class="parent-card">
      <label>孩子的名字 <input id="p-name" maxlength="12" /></label>
      <label>年级
        <select id="p-grade">
          <option value="2">二年级</option>
          <option value="3">三年级</option>
          <option value="4">四年级</option>
          <option value="5">五年级</option>
          <option value="6">六年级</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="p-captions" checked /> 显示英文字幕</label>
      <label class="check"><input type="checkbox" id="p-cloud" /> 允许云识别（预留，一期仍用浏览器语音）</label>
      <p>本周开口：<strong id="p-speak">0</strong></p>
      <p>金币：<strong id="p-coins">0</strong></p>
      <p>背包：<span id="p-bag">还没有</span></p>
      <p>走过的场景：<span id="p-scenes">还没有</span></p>
      <p>相册里出现过的词：<span id="p-words">还没有</span></p>
      <button type="button" class="primary" id="parent-save">保存</button>
      <button type="button" class="ghost" id="parent-reset">重新开始</button>
    </div>
  </section>

  <div id="market" class="overlay" hidden>
    <div class="talk-sheet market-sheet">
      <div class="talk-npc">
        <div>
          <strong id="market-title">小店货架</strong>
          <em id="market-sub">点一样，用金币买</em>
        </div>
        <button type="button" class="ghost" id="market-close">先看看</button>
      </div>
      <p class="talk-hint" id="market-coins">你有 0 枚金币</p>
      <div id="market-goods" class="goods"></div>
      <p class="talk-heard" id="market-note"></p>
    </div>
  </div>
  <div id="dialogue" class="overlay" hidden></div>
  <div id="picker" class="overlay" hidden></div>
  <div id="result" class="overlay" hidden>
    <div class="talk-sheet result-sheet">
      <div id="result-emoji" class="result-emoji">🥕</div>
      <p id="result-text"></p>
      <p id="result-line" class="talk-hint"></p>
      <p id="result-coins" class="coin-award"></p>
      <button type="button" class="primary" id="result-back">回到生活</button>
      <button type="button" class="ghost" id="result-album">看相册</button>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/data/more-events.js"></script>
  <script src="js/data/school-events.js"></script>
  <script src="js/data/town-events.js"></script>
  <script src="js/data/life-details.js"></script>
  <script src="js/data/alts.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/world.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
