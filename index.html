<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开口生活 · 公开页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #2c241b;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(255, 214, 170, 0.7), transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(168, 216, 200, 0.45), transparent 45%),
        linear-gradient(165deg, #f7efe3 0%, #e8f2ec 55%, #f3e7d8 100%);
    }
    .wrap { width: 100%; max-width: 440px; }
    .eyebrow {
      margin: 0 0 8px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: #7a6556;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
      line-height: 1.25;
    }
    .sub {
      margin: 0 0 22px;
      font-size: 0.95rem;
      color: #5c4d40;
      line-height: 1.55;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(255, 248, 238, 0.92);
      border: 1px solid rgba(90, 70, 50, 0.12);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 28px rgba(70, 50, 30, 0.08);
    }
    .card strong {
      display: block;
      font-size: 1.25rem;
      margin-bottom: 6px;
    }
    .card span {
      display: block;
      font-size: 0.9rem;
      color: #6b5a4c;
      line-height: 1.55;
    }
    .play {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700;
      color: #fff8ee;
      background: #e07a5f;
    }
    .more {
      margin-top: 16px;
      font-size: 0.82rem;
      color: #7a6556;
    }
    .more a { color: #2a9d8f; }
    .tip {
      margin: 18px 0 0;
      font-size: 0.75rem;
      color: #8a7768;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">公开网页</p>
    <h1>开口生活</h1>
    <p class="sub">在会长大的 2D 生活里，用英语把今天的事说完。手机和电脑都能打开。</p>

    <a class="card" href="newgame/home/">
      <strong>对着它说话，故事才继续</strong>
      <span>买菜、蹦高、下雨回家、学校借橡皮……先开口，剧情才会往下走。</span>
      <span class="play">开始玩</span>
    </a>

    <p class="more">其他游戏：<a href="newgame/value_game/">都市大亨</a></p>
    <p class="tip">语音请用 Chrome 或 Edge，并允许麦克风。进度保存在本机浏览器。</p>
  </div>
</body>
</html>
